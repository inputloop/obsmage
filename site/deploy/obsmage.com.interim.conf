# obsmage.com on gw33, INTERIM: port 80 only, until certbot holds the certificate.
# install.sh uses this block when /etc/letsencrypt/live/obsmage.com/fullchain.pem is missing.
# Copyright 2026 INPUTLOOP; GPL-3.0-or-later OR LGPL-3.0-or-later.

server {
    listen 80;
    listen [::]:80;
    server_name obsmage.com www.obsmage.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/obsmage.com/acme;
        default_type text/plain;
    }
    root /var/www/obsmage.com/public;
    index index.html;
    error_page 404 /404.html;
    autoindex off;
    etag on;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml text/plain;

    # The site's pages: everything from this origin, nothing inline, no connections at all
    # (the demo reads your files in the page and sends nothing; the policy makes sure of it).
    location / {
        include snippets/obsmage-common.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }

    # topology, staged from its own checkout at build time: its pages carry inline scripts,
    # each listed by hash in the generated policy; it may fetch from this origin only.
    location ^~ /topology/ {
        include snippets/obsmage-common.conf;
        include snippets/obsmage-topology-csp.conf;
        try_files $uri $uri/ =404;
    }

    # /dist/: the release bundles, mapped only when site.conf says releases: open (generated).
    include snippets/obsmage-releases.conf;
}
