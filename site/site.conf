# obsmage.com settings, read by site/build.py. One setting per line, "name: value".
#
# releases: open serves the staged bundles (/var/lib/obsmage-dist/public/ on gw33) at /dist/,
# with the channel feed at /dist/channel.json. closed maps nothing there (a 404), and the page
# says releases open when the project does. Either way the pipeline builds and stages them.
#   2026-11-02 17:44 CT: Corwin made inputloop/obsmage and obsmage-corwin public ("both obsmage
#   and obsmage-corwin are now public"); that met the unlock ("obsmage is public; publish its
#   releases"), so this line went from closed to open. Set it back to closed, rebuild and
#   install, to take /dist/ down again; nothing staged is deleted.
releases: open

