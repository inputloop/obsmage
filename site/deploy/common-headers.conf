# obsmage.com: the headers every location repeats (nginx's add_header does not inherit into a
# location that sets its own). Installed as /etc/nginx/snippets/obsmage-common.conf.
# X-Obsmage-Conf is replaced at install time with this install's id, so the installer can wait for
# the reload to land instead of guessing how long it takes.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cache-Control "no-cache" always;
add_header X-Obsmage-Conf "@CONF_ID@" always;
